<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>贪吃蛇 · 闯关版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="title"><span class="title-icon">🐍</span><span class="title-text">贪吃蛇</span></h1>
      <p class="subtitle">方向键 或 W A S D 转向 · 空格键暂停 / 继续 · 手机可直接滑动屏幕</p>
    </header>

    <section class="hud" aria-label="数据面板">
      <div class="hud-card">
        <span class="hud-label">得分</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">最高分</span>
        <span class="hud-value" id="best">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">关卡</span>
        <span class="hud-value" id="stage">1 / 4</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">等级</span>
        <span class="hud-value" id="level">1</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">长度</span>
        <span class="hud-value" id="length">3</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">升级次数</span>
        <span class="hud-value" id="upgrades">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">开局次数</span>
        <span class="hud-value" id="plays">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">难度</span>
        <span class="hud-value" id="difficultyText">普通</span>
      </div>
    </section>

    <section class="difficulty" aria-label="难度选择">
      <span class="difficulty-label">难度</span>
      <div class="segmented" id="difficulty" role="group">
        <button class="seg-btn" data-diff="easy" type="button">简单</button>
        <button class="seg-btn is-active" data-diff="normal" type="button">普通</button>
        <button class="seg-btn" data-diff="hard" type="button">困难</button>
      </div>
    </section>

    <section class="board-wrap">
      <canvas id="board" width="960" height="960" aria-label="游戏区域"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay-inner">
          <p class="overlay-emoji" id="overlayEmoji">🎮</p>
          <h2 class="overlay-title" id="overlayTitle">准备好了吗？</h2>
          <p class="overlay-text" id="overlayText">吃掉红苹果让蛇变长，别撞到墙壁、石墙和自己。</p>
          <button class="btn btn-primary" id="overlayBtn" type="button">开始游戏</button>
        </div>
      </div>
    </section>

    <section class="actions">
      <button class="btn" id="pauseBtn" type="button">暂停</button>
      <button class="btn" id="restartBtn" type="button">重新开始</button>
      <button class="btn btn-ghost" id="soundBtn" type="button">音效：开</button>
    </section>

    <section class="pad" aria-label="触屏方向控制">
      <button class="pad-btn pad-up" data-dir="up" type="button" aria-label="向上">▲</button>
      <button class="pad-btn pad-left" data-dir="left" type="button" aria-label="向左">◀</button>
      <button class="pad-btn pad-down" data-dir="down" type="button" aria-label="向下">▼</button>
      <button class="pad-btn pad-right" data-dir="right" type="button" aria-label="向右">▶</button>
    </section>

    <footer class="tips">
      <p class="tip-item"><span class="dot dot-red"></span>红苹果 +10 分，蛇身加长 1 节</p>
      <p class="tip-item"><span class="dot dot-gold"></span>金苹果 +30 分，额外加长，出现 7 秒后消失</p>
      <p class="tip-item"><span class="dot dot-blue"></span>每关吃满 8 个苹果进入下一关，共 4 关</p>
      <p class="tip-item"><span class="dot dot-green"></span>每吃 5 个苹果升 1 级，难度越高蛇速越快</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
